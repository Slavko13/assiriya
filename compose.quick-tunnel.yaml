services:
  wordpress:
    environment:
      WP_HOME: ${PUBLIC_URL:?Set PUBLIC_URL in the Quick Tunnel environment file}
      WP_SITEURL: ${PUBLIC_URL:?Set PUBLIC_URL in the Quick Tunnel environment file}
      WP_ENVIRONMENT_TYPE: production
      WORDPRESS_DEBUG: "0"
      WORDPRESS_FORCE_SSL_ADMIN: "false"
      AVTOZAKUP_SYNC_CODE: "1"
    expose:
      - "80"

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    volumes:
      - ./docker/caddy/Caddyfile.quick-tunnel:/etc/caddy/Caddyfile:ro
    tmpfs:
      - /config
      - /data
      - /tmp
    networks:
      - edge
    depends_on:
      wordpress:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://127.0.0.1:8080/__avtozakup_health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    security_opt:
      - no-new-privileges:true

  cloudflared:
    image: cloudflare/cloudflared:2026.10.7
    restart: "no"
    read_only: true
    cap_drop:
      - ALL
    command:
      - tunnel
      - --no-autoupdate
      - --url
      - http://caddy:8080
    tmpfs:
      - /tmp
    networks:
      - edge
    depends_on:
      caddy:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
