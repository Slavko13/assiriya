services:
  wordpress:
    ports:
      - "${WP_PORT:-8080}:80"
    environment:
      WP_HOME: ${WP_HOME:-http://localhost:${WP_PORT:-8080}}
      WP_SITEURL: ${WP_SITEURL:-http://localhost:${WP_PORT:-8080}}
      WP_ENVIRONMENT_TYPE: local
      WORDPRESS_DEBUG: ${WORDPRESS_DEBUG:-1}
      WORDPRESS_FORCE_SSL_ADMIN: "false"
      AVTOZAKUP_SYNC_CODE: "0"
    volumes:
      - ./wp-content/themes/avtozakup:/var/www/html/wp-content/themes/avtozakup
      - ./wp-content/plugins/avtozakup-core:/var/www/html/wp-content/plugins/avtozakup-core
    develop:
      watch:
        - action: sync
          path: ./wp-content/themes/avtozakup
          target: /var/www/html/wp-content/themes/avtozakup
        - action: sync
          path: ./wp-content/plugins/avtozakup-core
          target: /var/www/html/wp-content/plugins/avtozakup-core

  wpcli:
    volumes:
      - ./wp-content/themes/avtozakup:/var/www/html/wp-content/themes/avtozakup
      - ./wp-content/plugins/avtozakup-core:/var/www/html/wp-content/plugins/avtozakup-core
