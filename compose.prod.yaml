services:
  wordpress:
    environment:
      WP_HOME: ${PUBLIC_URL:?Set PUBLIC_URL to the externally reachable site URL}
      WP_SITEURL: ${PUBLIC_URL:?Set PUBLIC_URL to the externally reachable site URL}
      WP_ENVIRONMENT_TYPE: production
      WORDPRESS_DEBUG: "0"
      WORDPRESS_FORCE_SSL_ADMIN: ${WORDPRESS_FORCE_SSL_ADMIN:-false}
      AVTOZAKUP_SYNC_CODE: "1"
    expose:
      - "80"

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    environment:
      ADMIN_ALLOWED_CIDR: ${ADMIN_ALLOWED_CIDR:?Set ADMIN_ALLOWED_CIDR to the trusted administrator network}
    ports:
      - "${CADDY_HTTP_PORT:-8090}:80"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge
    depends_on:
      wordpress:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    security_opt:
      - no-new-privileges:true

volumes:
  caddy_data:
    name: avtozakup_caddy_data
  caddy_config:
    name: avtozakup_caddy_config
